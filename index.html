<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>কৃষিপথ • কৃষির ডিজিটাল ঠিকানা</title>
  <!-- PWA Manifest: পরে যোগ করবেন, আপাতত নেই -->
  <meta name="theme-color" content="#2d6a4f">
  <link rel="icon" type="image/png" href="https://i.ibb.co/album/krishipath-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Noto Sans Bengali', sans-serif; background:#f0fdf4; color:#0a2f1f; line-height:1.6; }
    :root {
      --primary: #2d6a4f; --primary-light: #40916c; --gold: #d4a373;
      --gold-light: #faedcd; --white: #ffffff; --gray-bg: #f8faf5;
      --shadow-sm: 0 10px 25px -5px rgba(0,0,0,0.05),0 8px 10px -6px rgba(0,0,0,0.02);
      --shadow-md: 0 20px 30px -10px rgba(0,0,0,0.08),0 10px 15px -8px rgba(0,0,0,0.05);
      --shadow-lg: 0 30px 40px -15px rgba(0,0,0,0.12);
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(24px);} to{opacity:1;transform:translateY(0);} }
    @keyframes popIn { 0%{opacity:0;transform:scale(0.7);} 100%{opacity:1;transform:scale(1);} }
    h1,h2,h3 { font-weight:700; color:var(--primary); }
    .section-title { font-size:clamp(2rem,6vw,2.8rem); font-weight:800; text-align:center; margin:2.5rem 0; position:relative; padding-bottom:1.2rem; }
    .section-title::after { content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:90px; height:4px; background:linear-gradient(90deg,var(--primary),var(--gold)); border-radius:4px; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; font-weight:600; padding:14px 32px; border-radius:60px; font-size:1rem; cursor:pointer; transition:all 0.25s; border:none; text-decoration:none; white-space:nowrap; box-shadow:var(--shadow-sm); min-height:52px; }
    .btn-primary { background:var(--primary); color:white; }
    .btn-primary:hover { background:#1e4a35; transform:translateY(-2px); }
    .btn-outline { background:transparent; border:2px solid var(--primary); color:var(--primary); }
    .btn-outline:hover { background:var(--primary); color:white; }
    .btn-gold { background:var(--gold); color:white; }
    .btn-sm { padding:10px 20px; font-size:0.9rem; min-height:44px; }
    .container { max-width:1300px; margin:0 auto; padding:0 5%; }
    .navbar { background:rgba(255,255,255,0.95); backdrop-filter:blur(12px); position:sticky; top:0; z-index:1000; padding:0.8rem 5%; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; border-bottom:1px solid rgba(0,0,0,0.05); }
    .logo { display:flex; align-items:center; gap:12px; }
    .logo-icon { background:var(--primary); color:white; width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:800; }
    .logo-text { font-weight:800; font-size:1.5rem; color:var(--primary); }
    .logo-text span { color:var(--gold); }
    .nav-links { display:flex; gap:2rem; align-items:center; }
    .nav-links a { text-decoration:none; color:var(--primary); font-weight:600; position:relative; }
    .nav-links a::after { content:''; position:absolute; bottom:0; left:0; width:0; height:2px; background:var(--gold); transition:width 0.2s; }
    .nav-links a:hover::after { width:100%; }
    .auth-buttons { display:flex; gap:12px; }
    .menu-toggle { display:none; background:none; border:none; font-size:1.8rem; color:var(--primary); cursor:pointer; }
    .notification-badge { position:relative; cursor:pointer; }
    .notification-badge .count { position:absolute; top:-8px; right:-10px; background:var(--gold); color:white; border-radius:50%; width:20px; height:20px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; }
    .page { display:none; animation:fadeUp 0.4s; }
    .page.active { display:block; }
    .card-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:2rem; margin:2rem 0; }
    .feature-card { background:white; padding:2rem 1.5rem; border-radius:28px; box-shadow:var(--shadow-sm); transition:all 0.25s; text-align:center; }
    .feature-card:hover { transform:translateY(-5px); box-shadow:var(--shadow-md); border-color:var(--gold-light); }
    .form-card { background:white; padding:2.5rem 2rem; border-radius:36px; box-shadow:var(--shadow-md); max-width:520px; margin:2rem auto; }
    .form-group { margin-bottom:1.5rem; }
    .form-group label { display:block; margin-bottom:8px; font-weight:600; color:var(--primary); }
    .form-control { width:100%; padding:16px 18px; border:2px solid #d1e7dd; border-radius:24px; font-size:1rem; background:#fafcff; }
    .form-control:focus { border-color:var(--primary); outline:none; box-shadow:0 0 0 4px rgba(45,106,79,0.1); }
    .admin-tabs { display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:2rem; }
    .admin-tab { background:none; border:none; padding:0.8rem 1.8rem; font-weight:600; color:#64748b; border-radius:40px; cursor:pointer; }
    .admin-tab.active { background:#d4edda; color:var(--primary); }
    .filter-tabs { display:flex; gap:0.8rem; flex-wrap:wrap; margin-bottom:2rem; }
    .filter-tab { background:#d1e7dd; border:none; padding:0.6rem 1.4rem; border-radius:30px; font-weight:600; cursor:pointer; color:var(--primary); }
    .filter-tab.active { background:var(--primary); color:white; }
    .pending-item { background:white; padding:1.5rem; border-radius:24px; box-shadow:var(--shadow-sm); margin-bottom:1rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; }
    .detail-box { background:#f8fafc; padding:1rem; border-radius:16px; margin-top:1rem; border:1px solid #e2e8f0; white-space:pre-wrap; word-break:break-word; }
    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); backdrop-filter:blur(6px); z-index:2000; align-items:center; justify-content:center; }
    .modal-content { background:white; padding:2rem; border-radius:24px; max-width:500px; width:90%; box-shadow:var(--shadow-lg); }
    .modal-close { float:right; background:none; border:none; font-size:1.5rem; cursor:pointer; }
    footer { background:var(--primary); color:white; padding:3rem 5% 1rem; margin-top:4rem; border-radius:40px 40px 0 0; }
    .footer-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:2rem; margin-bottom:2rem; }
    .footer-col h4 { color:var(--gold); margin-bottom:1rem; }
    .footer-col p, .footer-col a { color:rgba(255,255,255,0.9); font-size:0.95rem; }
    .social-links a { margin-right:12px; font-size:1.5rem; color:white; transition:color 0.2s; }
    .social-links a:hover { color:var(--gold); }
    .policy-section { background:rgba(255,255,255,0.1); border-radius:12px; padding:1rem; margin:1rem 0; }
    .policy-section summary { font-weight:600; color:var(--gold); cursor:pointer; }
    .footer-bottom { text-align:center; font-size:0.85rem; border-top:1px solid rgba(255,255,255,0.2); padding-top:1rem; }
    @media (max-width:768px) {
      .menu-toggle { display:block; }
      .nav-links { display:none; width:100%; flex-direction:column; padding:1.5rem 0; }
      .nav-links.active { display:flex; }
      .btn { width:100%; justify-content:center; }
    }
  </style>
</head>
<body>

<!-- নেভিগেশন, পেজ, ফুটার ইত্যাদি আগের মতোই, কোনো পরিবর্তন নেই -->

<!-- জাভাস্ক্রিপ্ট: সম্পূর্ণ কনক্যাটেনেশন-ভিত্তিক, কোনো টেমপ্লেট লিটারেল নেই -->
<script>
  // Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() { navigator.serviceWorker.register('/sw.js'); });
  }

  (function() {
    var SUPABASE_URL = 'https://uskcutjjmtcbgezcfbfm.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVza2N1dGpqbXRjYmdlemNmYmZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNTYyOTUsImV4cCI6MjA5MzgzMjI5NX0.q9OtdrTrkS7b465O4lMuxQ3GObO_mkU7bM4UxrsCNOA';
    var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // emailjs.init('YOUR_PUBLIC_KEY'); // আপনার পাবলিক কী দিন

    var currentUser = null, currentProfile = null;
    var currentBlogCat = 'all';
    var activeAdminTab = 'blog';
    var currentAnswerQuestionId = null;

    document.getElementById('menuToggle').addEventListener('click', function() {
      document.getElementById('navLinks').classList.toggle('active');
    });
    var navClickables = document.querySelectorAll('#navLinks a, #navLinks button, .notification-badge');
    navClickables.forEach(function(el) {
      el.addEventListener('click', function() {
        if (window.innerWidth <= 768) document.getElementById('navLinks').classList.remove('active');
      });
    });

    function navigateTo(pageId) {
      var pages = document.querySelectorAll('.page');
      pages.forEach(function(p) { p.classList.remove('active'); });
      document.getElementById(pageId).classList.add('active');
      window.location.hash = pageId;
      if (pageId === 'blog') loadBlogs();
      else if (pageId === 'forum') loadForum();
      else if (pageId === 'bazar') loadBazar();
      else if (pageId === 'prices') { loadLocations(); loadPrices(); }
      else if (pageId === 'profile') loadProfile();
      else if (pageId === 'admin') loadAdminPanel();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    var dataPages = document.querySelectorAll('[data-page]');
    dataPages.forEach(function(el) {
      el.addEventListener('click', function(e) { e.preventDefault(); navigateTo(el.dataset.page); });
    });
    window.onhashchange = function() { navigateTo(window.location.hash.substring(1) || 'home'); };

    function updateAuthUI() {
      var login = document.getElementById('loginBtn'), reg = document.getElementById('registerBtn'), logout = document.getElementById('logoutBtn');
      var profLink = document.getElementById('profileLink'), adminLink = document.getElementById('adminLink'), bell = document.getElementById('notifBell');
      if (currentUser) {
        login.style.display = 'none'; reg.style.display = 'none'; logout.style.display = 'inline-flex';
        profLink.style.display = 'inline-block';
        if (currentProfile && currentProfile.role === 'admin') adminLink.style.display = 'inline-block';
        else adminLink.style.display = 'none';
        bell.style.display = 'inline-block';
        updateNotifBadge();
      } else {
        login.style.display = 'inline-flex'; reg.style.display = 'inline-flex'; logout.style.display = 'none';
        profLink.style.display = 'none'; adminLink.style.display = 'none'; bell.style.display = 'none';
      }
      renderUploadForms();
    }

    async function updateNotifBadge() {
      if (!currentUser) return;
      var _a = await supabase.from('notifications').select('*', { count: 'exact', head: true }).eq('user_id', currentUser.id).eq('read', false);
      var count = _a.count || 0;
      document.getElementById('notifCount').textContent = count;
      document.getElementById('notifBell').querySelector('.count').style.display = count ? 'flex' : 'none';
    }

    function renderUploadForms() {
      var bUp = document.getElementById('blogUpload'), fUp = document.getElementById('forumUpload'), bazarUp = document.getElementById('bazarUpload');
      if (currentUser) {
        if (currentProfile.role === 'expert' || currentProfile.role === 'admin') {
          bUp.innerHTML = '<div class="form-card"><h3>ব্লগ লিখুন</h3>' +
            '<input id="blogTitle" placeholder="শিরোনাম" class="form-control">' +
            '<select id="blogCat" class="form-control mt-3"><option value="ফসল">ফসল</option><option value="মৎস্য">মৎস্য</option><option value="পশুপালন">পশুপালন</option><option value="জৈব সার">জৈব সার</option></select>' +
            '<textarea id="blogContent" rows="5" class="form-control mt-3" placeholder="আপনার লেখা"></textarea>' +
            '<button class="btn btn-primary w-100 mt-3" onclick="uploadBlog()">প্রকাশ করুন</button></div>';
        } else {
          bUp.innerHTML = '<p class="text-center">শুধুমাত্র কৃষিবিদ ও অ্যাডমিন ব্লগ লিখতে পারেন।</p>';
        }

        fUp.innerHTML = '<div class="form-card"><h3>প্রশ্ন জিজ্ঞাসা</h3>' +
          '<input id="qTitle" placeholder="বিষয়" class="form-control">' +
          '<textarea id="qBody" rows="4" class="form-control mt-3" placeholder="বিস্তারিত"></textarea>' +
          '<button class="btn btn-primary w-100 mt-3" onclick="askQuestion()">জিজ্ঞাসা করুন</button></div>';

        if (currentProfile.role === 'farmer' || currentProfile.role === 'admin') {
          bazarUp.innerHTML = '<div class="form-card"><h3>পণ্য বিক্রি করুন</h3>' +
            '<input id="prodName" placeholder="পণ্যের নাম" class="form-control">' +
            '<textarea id="prodDesc" rows="3" class="form-control mt-3" placeholder="বিবরণ"></textarea>' +
            '<input type="file" id="prodImage" accept="image/*" class="form-control mt-3">' +
            '<button class="btn btn-primary w-100 mt-3" onclick="uploadProduct()">পোস্ট করুন</button></div>';
        } else {
          bazarUp.innerHTML = '<p class="text-center">শুধুমাত্র কৃষকগণ পণ্য বিক্রির পোস্ট দিতে পারেন।</p>';
        }
      } else {
        bUp.innerHTML = fUp.innerHTML = bazarUp.innerHTML = '<p class="text-center">কন্টেন্ট জমা দিতে <a href="#" onclick="openAuth(\'login\')">লগইন</a> করুন।</p>';
      }
    }

    var authMode = 'login', modal = document.getElementById('authModal');
    window.openAuth = function(mode) {
      authMode = mode;
      document.getElementById('authTitle').textContent = mode === 'login' ? 'লগইন' : 'রেজিস্টার';
      document.getElementById('nameField').style.display = mode === 'register' ? 'block' : 'none';
      document.getElementById('phoneField').style.display = mode === 'register' ? 'block' : 'none';
      document.getElementById('roleField').style.display = mode === 'register' ? 'block' : 'none';
      document.getElementById('forgotPasswordForm').style.display = 'none';
      document.getElementById('authLinks').style.display = (mode === 'login' || mode === 'register') ? 'block' : 'none';
      modal.style.display = 'flex';
    };
    window.closeAuthModal = function() { modal.style.display = 'none'; };

    document.getElementById('switchAuthLink').addEventListener('click', function(e) { e.preventDefault(); openAuth(authMode === 'login' ? 'register' : 'login'); });
    document.getElementById('loginBtn').addEventListener('click', function() { openAuth('login'); });
    document.getElementById('registerBtn').addEventListener('click', function() { openAuth('register'); });
    document.getElementById('logoutBtn').addEventListener('click', async function() {
      await supabase.auth.signOut();
      currentUser = null; currentProfile = null; updateAuthUI(); navigateTo('home');
    });

    document.getElementById('forgotPasswordLink').addEventListener('click', function(e) {
      e.preventDefault();
      document.getElementById('authTitle').textContent = 'পাসওয়ার্ড রিসেট';
      document.getElementById('nameField').style.display = 'none';
      document.getElementById('phoneField').style.display = 'none';
      document.getElementById('roleField').style.display = 'none';
      document.getElementById('authForm').style.display = 'none';
      document.getElementById('authLinks').style.display = 'none';
      document.getElementById('forgotPasswordForm').style.display = 'block';
    });
    document.getElementById('backToLoginLink').addEventListener('click', function(e) {
      e.preventDefault();
      document.getElementById('forgotPasswordForm').style.display = 'none';
      document.getElementById('authForm').style.display = 'block';
      document.getElementById('authLinks').style.display = 'block';
      document.getElementById('authTitle').textContent = 'লগইন';
      authMode = 'login';
    });
    document.getElementById('sendResetLinkBtn').addEventListener('click', async function() {
      var email = document.getElementById('resetEmail').value;
      if (!email) return alert('ইমেইল দিন');
      var _a = await supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/?reset=true' });
      if (_a.error) alert('ত্রুটি: ' + _a.error.message);
      else { alert('পাসওয়ার্ড রিসেট লিংক আপনার ইমেইলে পাঠানো হয়েছে।'); closeAuthModal(); }
    });

    document.getElementById('authForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      var email = document.getElementById('authEmail').value, password = document.getElementById('authPassword').value;
      var name = document.getElementById('authName') ? document.getElementById('authName').value : null;
      var phone = document.getElementById('authPhone') ? document.getElementById('authPhone').value : null;
      var role = document.getElementById('authRole') ? document.getElementById('authRole').value : null;
      if (authMode === 'register') {
        var _a = await supabase.auth.signUp({ email: email, password: password });
        if (_a.error) return alert('রেজিস্ট্রেশন ত্রুটি: ' + _a.error.message);
        if (_a.data.user) {
          await supabase.from('profiles').insert([{ id: _a.data.user.id, name: name, phone: phone, role: role }]);
          alert('রেজিস্ট্রেশন সফল! এখন লগইন করুন।'); closeAuthModal();
        }
      } else {
        var _b = await supabase.auth.signInWithPassword({ email: email, password: password });
        if (_b.error) return alert('লগইন ত্রুটি: ' + _b.error.message);
        currentUser = _b.data.user;
        var _c = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();
        currentProfile = _c.data || { role: 'farmer' };
        updateAuthUI(); closeAuthModal(); navigateTo('home');
      }
    });

    supabase.auth.getSession().then(function(_a) {
      var session = _a.data.session;
      if (session) {
        currentUser = session.user;
        supabase.from('profiles').select('*').eq('id', currentUser.id).single().then(function(_b) {
          currentProfile = _b.data || { role: 'farmer' }; updateAuthUI();
        }).catch(function() { currentProfile = { role: 'farmer' }; updateAuthUI(); });
      }
      updateAuthUI(); navigateTo('home');
      checkAnnouncement();
    });

    // Blog functions
    async function loadBlogs() {
      var query = supabase.from('blogs').select('*').eq('approved', true).order('created_at', { ascending: false });
      if (currentBlogCat !== 'all') query = query.eq('category', currentBlogCat);
      var _a = await query;
      var data = _a.data;
      var grid = document.getElementById('blogGrid');
      grid.innerHTML = '';
      if (data && data.length) {
        data.forEach(function(b) {
          var card = document.createElement('div');
          card.className = 'feature-card';
          card.innerHTML = '<h4>' + b.title + '</h4><small>' + b.category + ' — ' + b.user_name + '</small><div style="white-space:pre-wrap; margin-top:1rem;">' + b.content + '</div>';
          grid.appendChild(card);
        });
      } else {
        grid.innerHTML = '<p>কোনো ব্লগ নেই</p>';
      }
    }
    async function uploadBlog() {
      if (currentProfile.role !== 'expert' && currentProfile.role !== 'admin') return alert('আপনার এই কাজের অনুমতি নেই।');
      var title = document.getElementById('blogTitle').value, cat = document.getElementById('blogCat').value, content = document.getElementById('blogContent').value;
      if (!title || !content) return alert('শিরোনাম ও লেখা দিন');
      await supabase.from('blogs').insert([{ title: title, category: cat, content: content, user_id: currentUser.id, user_name: currentProfile.name, approved: false }]);
      alert('জমা হয়েছে, অ্যাডমিন অনুমোদনের অপেক্ষায়।');
      loadBlogs();
    }
    document.getElementById('blogFilterTabs').addEventListener('click', function(e) {
      if (e.target.classList.contains('filter-tab')) {
        document.querySelectorAll('#blogFilterTabs .filter-tab').forEach(function(b) { b.classList.remove('active'); });
        e.target.classList.add('active');
        currentBlogCat = e.target.dataset.cat;
        loadBlogs();
      }
    });

    // Forum functions
    async function loadForum() {
      var _a = await supabase.from('forum_questions').select('*').eq('approved', true).order('created_at', { ascending: false });
      var questions = _a.data || [];
      var list = document.getElementById('forumList');
      list.innerHTML = '';
      for (var i = 0; i < questions.length; i++) {
        var q = questions[i];
        var _b = await supabase.from('forum_answers').select('*').eq('question_id', q.id).eq('approved', true).order('created_at', { ascending: true });
        var answers = _b.data || [];
        var card = document.createElement('div');
        card.className = 'feature-card';
        var answersHtml = '';
        if (answers.length) {
          answers.forEach(function(a) { answersHtml += '<p>' + a.answer + ' <small>— ' + a.user_name + '</small></p>'; });
        } else {
          answersHtml = 'কোনো উত্তর নেই';
        }
        card.innerHTML = '<h4>' + q.title + '</h4><p>' + q.body + '</p><small>— ' + q.user_name + '</small>' +
          '<div class="mt-3"><strong>উত্তর (' + answers.length + '):</strong> ' + answersHtml + '</div>' +
          '<button class="btn btn-outline btn-sm mt-2" onclick="openAnswerModal(' + q.id + ')">উত্তর দিন</button>';
        list.appendChild(card);
      }
      if (!questions.length) list.innerHTML = '<p>কোনো প্রশ্ন নেই</p>';
    }
    async function askQuestion() {
      var title = document.getElementById('qTitle').value, body = document.getElementById('qBody').value;
      if (!title || !body) return alert('বিষয় ও বিবরণ দিন');
      await supabase.from('forum_questions').insert([{ title: title, body: body, user_id: currentUser.id, user_name: currentProfile.name, approved: true }]);
      alert('প্রশ্ন জমা হয়েছে'); loadForum();
    }
    window.openAnswerModal = function(questionId) {
      if (!currentUser) { alert('উত্তর দিতে লগইন করুন।'); return; }
      if (currentProfile.role !== 'expert' && currentProfile.role !== 'admin') { alert('শুধুমাত্র কৃষিবিদ ও অ্যাডমিন উত্তর দিতে পারেন।'); return; }
      currentAnswerQuestionId = questionId;
      document.getElementById('answerModal').style.display = 'flex';
    };
    window.closeAnswerModal = function() {
      document.getElementById('answerModal').style.display = 'none';
      document.getElementById('answerText').value = '';
      currentAnswerQuestionId = null;
    };
    window.submitAnswer = async function() {
      var body = document.getElementById('answerText').value.trim();
      if (!body) return;
      await supabase.from('forum_answers').insert([{ question_id: currentAnswerQuestionId, user_id: currentUser.id, user_name: currentProfile.name, answer: body, approved: false }]);
      alert('উত্তর জমা হয়েছে, অ্যাডমিন অনুমোদনের অপেক্ষায়।');
      closeAnswerModal();
      loadForum();
    };

    // Krishibazar functions
    async function loadBazar() {
      var _a = await supabase.from('products').select('*').eq('approved', true).order('created_at', { ascending: false });
      var data = _a.data || [];
      var grid = document.getElementById('bazarGrid');
      grid.innerHTML = '';
      data.forEach(function(p) {
        var imgSrc = p.image_url || '';
        var card = document.createElement('div');
        card.className = 'feature-card';
        card.innerHTML = (imgSrc ? '<img src="' + imgSrc + '" style="width:100%; height:200px; object-fit:cover; border-radius:16px; margin-bottom:1rem;">' : '') +
          '<h4>' + p.name + '</h4><p>' + (p.description || '') + '</p><small>বিক্রেতা: ' + p.user_name + '</small><br>' +
          '<button class="btn btn-outline btn-sm mt-2" onclick="expressInterest(\'' + p.id + '\')">আগ্রহী</button>';
        grid.appendChild(card);
      });
      if (!data.length) grid.innerHTML = '<p>কোনো পণ্য নেই</p>';
    }
    async function uploadProduct() {
      if (currentProfile.role !== 'farmer' && currentProfile.role !== 'admin') return alert('আপনার এই কাজের অনুমতি নেই।');
      var name = document.getElementById('prodName').value, desc = document.getElementById('prodDesc').value;
      var file = document.getElementById('prodImage').files[0];
      if (!name) return alert('পণ্যের নাম দিন');
      var imageUrl = null;
      if (file) {
        var fileName = 'prod_' + Date.now();
        var _a = await supabase.storage.from('images').upload(fileName, file);
        if (_a.error) return alert('ছবি আপলোড ত্রুটি: ' + _a.error.message);
        var _b = supabase.storage.from('images').getPublicUrl(fileName);
        imageUrl = _b.data.publicUrl;
      }
      await supabase.from('products').insert([{ name: name, description: desc, image_url: imageUrl, user_id: currentUser.id, user_name: currentProfile.name, approved: false }]);
      alert('পণ্য জমা হয়েছে, অ্যাডমিন অনুমোদনের অপেক্ষায়।');
      loadBazar();
    }
    window.expressInterest = async function(productId) {
      if (!currentUser) return alert('আগ্রহ দেখাতে লগইন করুন।');
      var _a = await supabase.from('products').select('user_id').eq('id', productId).single();
      if (!_a.data) return;
      await supabase.from('notifications').insert([{ user_id: _a.data.user_id, message: '📢 আপনার পণ্যে একজন ব্যবসায়ী আগ্রহ প্রকাশ করেছেন।' }]);
      alert('আগ্রহ প্রকাশ করা হয়েছে! কৃষক অবহিত হবেন।');
    };

    // Agent prices functions
    async function loadLocations() {
      var _a = await supabase.from('agent_prices').select('location', { distinct: true });
      var locations = _a.data || [];
      var locFilter = document.getElementById('locationFilter');
      locFilter.innerHTML = '<option value="all">সব এলাকা</option>';
      locations.forEach(function(d) { if (d.location) locFilter.innerHTML += '<option value="' + d.location + '">' + d.location + '</option>'; });
    }
    async function loadPrices() {
      var location = document.getElementById('locationFilter').value;
      var query = supabase.from('agent_prices').select('*').eq('approved', true).order('created_at', { ascending: false });
      if (location !== 'all') query = query.eq('location', location);
      var _a = await query;
      var data = _a.data || [];
      var grid = document.getElementById('priceGrid');
      grid.innerHTML = '';
      data.forEach(function(p) {
        var card = document.createElement('div');
        card.className = 'feature-card';
        card.innerHTML = '<h4>' + p.crop + '</h4><p>' + p.price + ' টাকা / কেজি</p><small>এলাকা: ' + p.location + ' | এজেন্ট: ' + p.user_name + '</small>';
        grid.appendChild(card);
      });
      if (!data.length) grid.innerHTML = '<p>কোনো দর তালিকাভুক্ত হয়নি</p>';
    }
    async function uploadAgentPrice() {
      if (currentProfile.role !== 'agent' && currentProfile.role !== 'admin') return alert('শুধুমাত্র এজেন্ট ও অ্যাডমিন বাজার দর যোগ করতে পারেন।');
      var crop = document.getElementById('agentCrop').value, price = document.getElementById('agentPrice').value, location = document.getElementById('agentLocation').value;
      if (!crop || !price || !location) return alert('সব তথ্য পূরণ করুন');
      await supabase.from('agent_prices').insert([{ crop: crop, price: parseFloat(price), location: location, user_id: currentUser.id, user_name: currentProfile.name, approved: false }]);
      alert('জমা হয়েছে'); loadPrices();
    }

    // Profile
    async function loadProfile() {
      if (!currentUser) return navigateTo('home');
      document.getElementById('profileInfo').innerHTML = '<p><strong>নাম:</strong> ' + (currentProfile.name || '') + '</p><p><strong>ইমেইল:</strong> ' + currentUser.email + '</p><p><strong>ফোন:</strong> ' + (currentProfile.phone || 'N/A') + '</p><p><strong>রোল:</strong> ' + currentProfile.role + '</p>';
      var _a = await supabase.from('notifications').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false }).limit(5);
      var notifs = _a.data || [];
      var notifList = document.getElementById('notifList');
      notifList.innerHTML = '';
      notifs.forEach(function(n) { notifList.innerHTML += '<p>🔔 ' + n.message + ' <small>' + new Date(n.created_at).toLocaleString() + '</small></p>'; });
      if (!notifs.length) notifList.innerHTML = '<p>কোনো নোটিফিকেশন নেই</p>';
      await supabase.from('notifications').update({ read: true }).eq('user_id', currentUser.id).eq('read', false);
      updateNotifBadge();
    }

    // Admin Panel
    async function loadAdminPanel() {
      if (!currentProfile || currentProfile.role !== 'admin') return navigateTo('home');
      var container = document.getElementById('adminContent');
      container.innerHTML = '';
      if (activeAdminTab === 'blog') {
        var _a = await supabase.from('blogs').select('*').eq('approved', false);
        var items = _a.data || [];
        items.forEach(function(b) {
          var div = document.createElement('div'); div.className = 'pending-item';
          div.innerHTML = '<div><strong>' + b.title + '</strong> (' + b.category + ') by ' + b.user_name + '</div>' +
            '<div><button class="btn btn-primary btn-sm" onclick="approveItem(\'blogs\',' + b.id + ')">অনুমোদন</button> ' +
            '<button class="btn btn-outline btn-sm" onclick="cancelItem(\'blogs\',' + b.id + ')">বাতিল</button></div>';
          container.appendChild(div);
        });
        if (!items.length) container.innerHTML = '<p>কোনো পেন্ডিং নেই</p>';
      } else if (activeAdminTab === 'products') {
        var _b = await supabase.from('products').select('*').eq('approved', false);
        var prods = _b.data || [];
        prods.forEach(function(p) {
          var div = document.createElement('div'); div.className = 'pending-item';
          div.innerHTML = '<div><strong>' + p.name + '</strong> by ' + p.user_name + '</div>' +
            '<div><button class="btn btn-primary btn-sm" onclick="approveItem(\'products\',' + p.id + ')">অনুমোদন</button> ' +
            '<button class="btn btn-outline btn-sm" onclick="cancelItem(\'products\',' + p.id + ')">বাতিল</button></div>';
          container.appendChild(div);
        });
        if (!prods.length) container.innerHTML = '<p>কোনো পেন্ডিং নেই</p>';
      } else if (activeAdminTab === 'prices') {
        var _c = await supabase.from('agent_prices').select('*').eq('approved', false);
        var prices = _c.data || [];
        prices.forEach(function(p) {
          var div = document.createElement('div'); div.className = 'pending-item';
          div.innerHTML = '<div>' + p.crop + ' (' + p.location + ') — ' + p.price + ' টাকা by ' + p.user_name + '</div>' +
            '<div><button class="btn btn-primary btn-sm" onclick="approveItem(\'agent_prices\',' + p.id + ')">অনুমোদন</button> ' +
            '<button class="btn btn-outline btn-sm" onclick="cancelItem(\'agent_prices\',' + p.id + ')">বাতিল</button></div>';
          container.appendChild(div);
        });
        if (!prices.length) container.innerHTML = '<p>কোনো পেন্ডিং নেই</p>';
      } else if (activeAdminTab === 'answers') {
        var _d = await supabase.from('forum_answers').select('*').eq('approved', false).order('created_at', { ascending: false });
        var answers = _d.data || [];
        answers.forEach(function(a) {
          var div = document.createElement('div'); div.className = 'pending-item';
          div.innerHTML = '<div><strong>উত্তর:</strong> ' + a.answer.substring(0, 100) + '...<br><small> দ্বারা ' + a.user_name + '</small></div>' +
            '<div><button class="btn btn-primary btn-sm" onclick="approveAnswer(' + a.id + ')">অনুমোদন</button> ' +
            '<button class="btn btn-outline btn-sm" onclick="cancelItem(\'forum_answers\',' + a.id + ')">বাতিল</button></div>';
          container.appendChild(div);
        });
        if (!answers.length) container.innerHTML = '<p>কোনো পেন্ডিং উত্তর নেই</p>';
      } else if (activeAdminTab === 'notification') {
        container.innerHTML = '<div class="form-card"><h3>🔔 সকলকে নোটিফিকেশন পাঠান</h3><textarea id="notifMsg" class="form-control" placeholder="মেসেজ"></textarea><button class="btn btn-primary w-100 mt-3" onclick="sendAdminNotification()">পাঠান</button></div>';
      } else if (activeAdminTab === 'email') {
        container.innerHTML = '<div class="form-card"><h3>📧 সকলকে ইমেইল পাঠান</h3><textarea id="emailMsg" class="form-control" placeholder="মেসেজ"></textarea><button class="btn btn-primary w-100 mt-3" onclick="sendEmailToAll()">ইমেইল পাঠান</button><p class="field-hint mt-2">EmailJS কনফিগার করতে হবে।</p></div>';
      } else if (activeAdminTab === 'announcement') {
        container.innerHTML = '<div class="form-card"><h3>📢 পপ-আপ ঘোষণা</h3><textarea id="announceMsg" class="form-control" placeholder="মেসেজ"></textarea><button class="btn btn-primary w-100 mt-3" onclick="createAnnouncement()">পোস্ট করুন</button></div>';
      }
    }

    document.querySelectorAll('.admin-tab').forEach(function(t) {
      t.addEventListener('click', function() {
        document.querySelectorAll('.admin-tab').forEach(function(tab) { tab.classList.remove('active'); });
        this.classList.add('active');
        activeAdminTab = this.dataset.tab;
        loadAdminPanel();
      });
    });

    window.approveItem = async function(table, id) {
      var _a = await supabase.from(table).select('*').eq('id', id).single();
      if (!_a.data) return;
      await supabase.from(table).update({ approved: true }).eq('id', id);
      if (_a.data.user_id) {
        await supabase.from('notifications').insert([{ user_id: _a.data.user_id, message: '✅ আপনার কন্টেন্ট (' + table + ') অনুমোদিত হয়েছে।' }]);
      }
      if (table === 'products') {
        var _b = await supabase.from('profiles').select('id').eq('role', 'businessman');
        if (_b.data) {
          var notifs = _b.data.map(function(b) { return { user_id: b.id, message: '📢 কৃষিবাজারে নতুন পণ্য: ' + _a.data.name }; });
          await supabase.from('notifications').insert(notifs);
        }
      }
      alert('অনুমোদিত হয়েছে');
      loadAdminPanel();
      refreshPublicPages(table);
    };

    window.cancelItem = async function(table, id) {
      if (!confirm('আপনি কি নিশ্চিত এটি বাতিল করতে চান?')) return;
      var _a = await supabase.from(table).select('*').eq('id', id).single();
      if (_a.data && _a.data.user_id) {
        await supabase.from('notifications').insert([{ user_id: _a.data.user_id, message: '❌ আপনার কন্টেন্ট (' + table + ') বাতিল করা হয়েছে।' }]);
      }
      await supabase.from(table).delete().eq('id', id);
      alert('বাতিল করা হয়েছে');
      loadAdminPanel();
      refreshPublicPages(table);
    };

    window.approveAnswer = async function(answerId) {
      var _a = await supabase.from('forum_answers').select('*').eq('id', answerId).single();
      if (!_a.data) return;
      await supabase.from('forum_answers').update({ approved: true }).eq('id', answerId);
      if (_a.data.user_id) {
        await supabase.from('notifications').insert([{ user_id: _a.data.user_id, message: '✅ আপনার উত্তর অনুমোদিত হয়েছে।' }]);
      }
      alert('উত্তর অনুমোদিত');
      loadAdminPanel();
      loadForum();
    };

    function refreshPublicPages(table) {
      var activePage = document.querySelector('.page.active').id;
      if (table === 'blogs' && activePage === 'blog') loadBlogs();
      if (table === 'products' && activePage === 'bazar') loadBazar();
      if (table === 'agent_prices' && activePage === 'prices') loadPrices();
      if (table === 'forum_answers' && activePage === 'forum') loadForum();
    }

    window.sendAdminNotification = async function() {
      var msg = document.getElementById('notifMsg').value;
      if (!msg) return alert('মেসেজ লিখুন');
      var _a = await supabase.from('profiles').select('id');
      if (_a.data) {
        for (var i = 0; i < _a.data.length; i++) {
          await supabase.from('notifications').insert([{ user_id: _a.data[i].id, message: '🔔 অ্যাডমিন: ' + msg }]);
        }
      }
      alert('সকলকে নোটিফিকেশন পাঠানো হয়েছে');
    };

    window.sendEmailToAll = async function() {
      var msg = document.getElementById('emailMsg').value;
      if (!msg) return alert('মেসেজ লিখুন');
      var _a = await supabase.from('profiles').select('email, name');
      var users = _a.data || [];
      var count = 0;
      for (var i = 0; i < users.length; i++) {
        var u = users[i];
        if (!u.email) continue;
        try {
          await emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', {
            to_email: u.email,
            to_name: u.name || 'কৃষিপথ সদস্য',
            message: msg
          });
          count++;
        } catch (e) { console.error(e); }
      }
      alert(count + ' টি ইমেইল পাঠানো হয়েছে');
    };

    window.createAnnouncement = async function() {
      var msg = document.getElementById('announceMsg').value;
      if (!msg) return alert('মেসেজ লিখুন');
      await supabase.from('announcements').delete().neq('id', 0);
      await supabase.from('announcements').insert([{ message: msg }]);
      alert('ঘোষণা সেট হয়েছে');
    };

    async function checkAnnouncement() {
      var _a = await supabase.from('announcements').select('*').order('created_at', { ascending: false }).limit(1);
      if (_a.data && _a.data.length) {
        document.getElementById('announceText').innerText = _a.data[0].message;
        document.getElementById('announcePopup').style.display = 'flex';
      }
    }
    window.closeAnnouncement = function() { document.getElementById('announcePopup').style.display = 'none'; };

    window.navigateTo = navigateTo;
    window.uploadBlog = uploadBlog;
    window.uploadProduct = uploadProduct;
    window.uploadAgentPrice = uploadAgentPrice;
    window.askQuestion = askQuestion;
    window.openAuth = openAuth;
    window.closeAuthModal = closeAuthModal;
    window.closeAnnouncement = closeAnnouncement;

    renderUploadForms();
  })();
</script>
</body>
</html>
